<div class="mb-3">
  <p-breadcrumb
        class="max-w-full"
        [model]="items"
        [home]="home" />
</div>
<div class="contenedorP">
  <div>
    <p-table
      [value]="rutinas"
      [paginator]="true"
      [rows]="3"
      responsiveLayout="stack"
      [breakpoint]="'960px'"
      [tableStyle]="{'min-width': '23rem'}">
        <ng-template pTemplate="header" let-columns>
          <tr>
            <th>Rutina</th>
            <th></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-rt let-columns="columns">
          <tr>
            <td>
              <span class="p-column-title boldletra">Rutina</span>{{rt.rutina}}
            </td>
            <td>
              <span class="p-column-title boldletra">Eliminar Registro</span>
              <p-confirmDialog/>
              <p-button
                [rounded]="true"
                icon="pi pi-times"
                severity="danger"
                [outlined]="true"
                size="small"
                (onClick)="onSelectRutinas(rt, $event)">
              </p-button>
            </td>
          </tr>
        </ng-template>
    </p-table>
    <div class="botonPrincipal">
      <p-button
        label="Adicionar Nombre de Rutina"
        size="small"
        severity="warning"
        (onClick)="onFormRHandle()">
      </p-button>
    </div>
  </div>
</div>
<p-dialog
    header="Crear Nombre de Rutina"
    [(visible)]="formVisible"
    [modal]="true"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
    [style]="{ width: '50vw' }"
    [draggable]="false"
    [resizable]="false">
        <div>
          <form [formGroup]="formR" (submit)="onSaveRutina($event)">
            <div >
              <input class="inputForm" type="text" name="rutina" id="rutina" formControlName="rutina" [ngClass]="{'error': formR.get('rutina')?.invalid && formR.get('rutina')?.touched}">
              @if (formR.get('rutina')?.errors && formR.get('rutina')?.touched) {
                <div>
                  <p class="messageError">el campo es requerido</p>
                </div>
              }
            </div>
            <div class="botonguardar">
              <p-button
                label="Guardar"
                [disabled]="!formR.valid"
                (click)="onSaveRutina($event)">
              </p-button>
            </div>
          </form>
        </div>
</p-dialog>
